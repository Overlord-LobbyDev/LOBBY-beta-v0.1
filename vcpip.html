<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Voice PiP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
  /* ═══════════════════════════════════════════════════════════════════
     The floating window, in the table's own language.

     It used to show a face tile beside the screenshare, which is two
     things competing in a window barely wide enough for one -- and the
     face was the half you did not open this for. So the screen fills it,
     and who is talking is said over the top of the screen rather than
     next to it.

     Typography, glass and accent are the room's, so the window reads as
     a piece of the app rather than a system dialog. ═══ */
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg-0:#0b0d13;
    --accent:#7ee2a8;            /* live green, as the call chip uses */
    --danger:#ff8fa3;
    --text-1:#e9ecf3; --text-2:#a8b0c2; --text-3:#6b7387;
    --font:'Archivo', system-ui, "Noto Sans", sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  html, body {
    width:100%; height:100%; background:transparent; overflow:hidden;
    user-select:none; font-family:var(--font);
    -webkit-font-smoothing:antialiased;
  }

  #pip {
    width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden;
    border-radius:14px;
    background:linear-gradient(168deg, #14161e 0%, #0b0d13 100%);
    border:1px solid rgba(126,226,168,.3);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.95), 0 0 60px -34px rgba(126,226,168,.55);
    -webkit-app-region:no-drag;
  }

  /* ── Header ────────────────────────────────────────────────── */
  /* Interactive, so hovering anywhere reveals the controls. */
  #pip { -webkit-app-region:no-drag; }
  /* No drag regions anywhere: the window is moved by hand below, which
     is the only way to have both dragging and a window that can be
     hovered. */
  #pip { cursor:grab; }
  /* The picture is the biggest thing in the window, and an <img> is
     draggable by default -- so grabbing it started the browser's own
     drag-and-drop with a ghost of the image, and never reached the
     pointer handler below. */
  #pip img, #pip video {
    -webkit-user-drag:none; user-select:none; pointer-events:none;
  }
  #pip.dragging { cursor:grabbing; }
  #pip button, #pip .pctrl { cursor:pointer; }

  #pipBar {
    position:absolute; z-index:3; top:0; left:0; right:0;
    display:flex; align-items:center; gap:9px;
    padding:9px 9px 22px 11px;
    /* A scrim rather than a bar: it darkens what is behind the name
       without occupying any of it. */
    background:linear-gradient(180deg, rgba(6,8,12,.82) 0%, rgba(6,8,12,.35) 55%, transparent 100%);
    opacity:0; transition:opacity .18s;
    pointer-events:none;
  }
  /* Present when you are pointing at the window, gone when you are just
     watching it. */
  #pip:hover #pipBar, #pip.touched #pipBar { opacity:1; pointer-events:auto; }
  /* An equaliser, as the sidebar call chip uses. A dot says "on"; this
     says "sound is happening", which is the actual news. */
  .eq { display:flex; align-items:flex-end; gap:2px; height:13px; flex:0 0 auto; }
  .eq i {
    width:2.5px; border-radius:2px; background:var(--accent);
    animation:bar 1.1s ease-in-out infinite;
  }
  .eq i:nth-child(1){ height:6px;  animation-delay:0s; }
  .eq i:nth-child(2){ height:12px; animation-delay:.18s; }
  .eq i:nth-child(3){ height:8px;  animation-delay:.36s; }
  @keyframes bar {
    0%,100% { transform:scaleY(.45); }
    50%     { transform:scaleY(1); }
  }
  .id { flex:1; min-width:0; display:flex; align-items:baseline; gap:7px; }
  .id .eyebrow {
    flex:0 0 auto;
    font-family:var(--mono); font-size:7.5px; font-weight:700;
    letter-spacing:1.8px; text-transform:uppercase; color:var(--accent);
  }
  #pipName {
    font-family:var(--mono); font-size:9px; font-weight:700;
    letter-spacing:1.4px; text-transform:uppercase; color:#fff;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    text-shadow:0 1px 6px rgba(0,0,0,.9);
  }
  .pip-btn {
    background:none; border:0; border-radius:7px; color:var(--text-3);
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s, color .15s;
  }
  .pip-btn:hover { background:rgba(255,255,255,.09); color:#fff; }

  /* ── The screen ────────────────────────────────────────────────
     The whole point of the window, so it gets all of it. */
  #pipBody { flex:1; min-height:0; position:relative; overflow:hidden; background:#05070d; }
  /* No header above it any more, so the picture starts at the top edge. */
  #pip { position:relative; }
  #shot { width:100%; height:100%; object-fit:contain; display:block; }

  /* What you are looking at, bottom left. */
  .src {
    position:absolute; left:8px; bottom:46px; padding:3px 9px; border-radius:6px;
    background:rgba(6,8,12,.78); backdrop-filter:blur(6px);
    font-family:var(--mono); font-size:8.5px; font-weight:700;
    letter-spacing:1.2px; text-transform:uppercase; color:#fff;
  }

  /* Who is in the call, bottom right, over the screen rather than
     beside it. Small enough to ignore, present enough to answer "who
     else is here" without leaving. */
  .who {
    position:absolute; right:8px; bottom:46px; display:flex; gap:5px; align-items:flex-end;
  }
  .face {
    position:relative; width:26px; height:26px; border-radius:50%;
    background:#20142f center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; color:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,.16), 0 4px 10px -4px #000;
    transition:transform .16s, box-shadow .16s;
  }
  .face img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
  /* Speaking: no ring. The face lifts and a bar of level sits under it,
     the way a desk shows a live channel. */
  .face.talking {
    transform:translateY(-3px);
    box-shadow:0 0 0 1px rgba(126,226,168,.55), 0 6px 14px -4px rgba(126,226,168,.7);
  }
  .face.talking::after {
    content:""; position:absolute; left:2px; right:2px; bottom:-5px; height:2.5px;
    border-radius:2px; background:var(--accent);
    box-shadow:0 0 10px rgba(126,226,168,.9);
    animation:level 1.1s ease-in-out infinite;
  }
  @keyframes level {
    0%,100% { transform:scaleX(.7); opacity:.6; }
    50%     { transform:scaleX(1);  opacity:1; }
  }
  .face.off { opacity:.45; }
  .face .mic {
    position:absolute; right:-2px; bottom:-2px; width:13px; height:13px; border-radius:50%;
    background:#e03050; border:2px solid #0b0d13;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }

  /* ── No screen: just the people ───────────────────────────────── */
  #pipBody.faces { display:flex; align-items:center; justify-content:center; gap:10px;
                   padding:14px; background:transparent; flex-wrap:wrap; }
  #pipBody.faces .face { width:54px; height:54px; font-size:19px; }
  #pipBody.faces .face .mic { width:18px; height:18px; }
  #pipBody.faces .nm {
    position:absolute; left:50%; transform:translateX(-50%); bottom:-17px;
    font-family:var(--mono); font-size:8px; font-weight:700; letter-spacing:1px;
    text-transform:uppercase; color:var(--text-3); white-space:nowrap;
  }
  #pipBody.faces .stack { position:relative; margin-bottom:16px; }

  /* ── Controls ─────────────────────────────────────────────────── */
  #pipCtrls {
    position:absolute; z-index:3; left:0; right:0; bottom:0;
    display:flex; gap:5px; padding:22px 8px 8px;
    background:linear-gradient(0deg, rgba(6,8,12,.85) 0%, rgba(6,8,12,.4) 55%, transparent 100%);
    opacity:0; transition:opacity .18s;
    pointer-events:none;
  }
  #pip:hover #pipCtrls, #pip.touched #pipCtrls { opacity:1; pointer-events:auto; }
  /* Backed individually, so they stay legible over a bright screen. */
  .pctrl { background:rgba(10,12,18,.72) !important; backdrop-filter:blur(6px); }
  .pctrl:hover { background:rgba(255,255,255,.14) !important; color:#fff; }
  .pctrl.on { background:rgba(126,226,168,.22) !important; color:var(--accent); }
  .pctrl.muted { background:rgba(255,60,90,.24) !important; color:var(--danger); }
  .pctrl {
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 6px; border:0; border-radius:9px; cursor:pointer;
    background:rgba(255,255,255,.05); color:var(--text-2);
    font-family:var(--mono); font-size:9px; font-weight:700;
    letter-spacing:1.1px; text-transform:uppercase;
    transition:background .15s, color .15s;
  }
  .pctrl:hover { background:rgba(255,255,255,.1); color:#fff; }
  .pctrl.on { background:rgba(126,226,168,.16); color:var(--accent); }
  .pctrl.muted { background:rgba(255,60,90,.14); color:var(--danger); }
  .pctrl.leave:hover { background:rgba(255,60,90,.2); color:var(--danger); }
  </style>
</head>
<body>
  <div id="pip">
    <div id="pipBar">
      <span class="eq"><i></i><i></i><i></i></span>
      <div class="id">
        <div class="eyebrow" id="pipEyebrow">In voice</div>
        <div id="pipName">Voice</div>
      </div>
      <button class="pip-btn" id="btnExpand" title="Open the table">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </button>
    </div>

    <div id="pipBody"></div>

    <div id="pipCtrls">
      <button class="pctrl" id="btnMute">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
        <span id="muteLabel">Mute</span>
      </button>
      <button class="pctrl" id="btnScreen">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>
        <span id="shareLabel">Share</span>
      </button>
      <button class="pctrl leave" id="btnLeave">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Leave</span>
      </button>
    </div>
  </div>

<script>
  const api = window.electronAPI;
  api?.onVcPipData(data => render(data));

  let lastUrl = null;
  const micOff = '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 4l16 16"/><path d="M15 9V5.5a3 3 0 0 0-6 0V9M5 11a7 7 0 0 0 10.6 6"/></svg>';

  function faceHTML(m, withName) {
    const av = m.avatarUrl
      ? `<img src="${m.avatarUrl}" alt=""/>`
      : (m.username || "?").slice(0, 1).toUpperCase();
    const cls = "face" + (m.speaking ? " talking" : "") + (m.muted ? " off" : "");
    const mic = m.muted ? `<span class="mic">${micOff}</span>` : "";
    const face = `<div class="${cls}" title="${m.username || ""}">${av}${mic}</div>`;
    return withName
      ? `<div class="stack">${face}<span class="nm">${m.username || "?"}</span></div>`
      : face;
  }

  function render(data) {
    if (!data) return;
    const { channelName, members = [], muted, sharing,
            shareFrame = null, shareBuf = null, shareWho = null } = data;

    /* "Table · Street Fighter 6" is two facts joined by a separator: what
       kind of room it is, and which game. They read better stacked than
       run together in one line. */
    const raw = channelName || "Voice";
    const cut = raw.indexOf(" · ");
    const kind = cut > 0 ? raw.slice(0, cut) : "In voice";
    const name = cut > 0 ? raw.slice(cut + 3) : raw;
    document.getElementById("pipEyebrow").textContent = kind;
    document.getElementById("pipName").textContent = name;

    const btnMute = document.getElementById("btnMute");
    btnMute.classList.toggle("muted", !!muted);
    document.getElementById("muteLabel").textContent = muted ? "Unmute" : "Mute";

    const btnScreen = document.getElementById("btnScreen");
    btnScreen.classList.toggle("on", !!sharing);
    document.getElementById("shareLabel").textContent = sharing ? "Stop" : "Share";

    const body = document.getElementById("pipBody");

    /* A live screen takes the whole window. Everyone in the call is said
       over the top of it in miniature rather than given a tile of their
       own -- in a window this size, a second thing to look at means
       neither is worth looking at. */
    /* Frames arrive as raw JPEG bytes. An object URL is made for each
       and the previous one released immediately -- forgetting that at
       twenty-four frames a second leaks a few megabytes a minute. */
    let frameSrc = shareFrame;
    if (shareBuf) {
      try {
        const bytes = shareBuf instanceof Uint8Array ? shareBuf : new Uint8Array(shareBuf);
        const url = URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" }));
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = url;
        frameSrc = url;
      } catch (e) { frameSrc = shareFrame; }
    }

    if (frameSrc) {
      let shot = document.getElementById("shot");
      if (!shot) {
        body.className = "";
        body.innerHTML =
          '<img id="shot" alt=""><div class="src"></div><div class="who"></div>';
        shot = document.getElementById("shot");
      }
      /* Swapped in place: rebuilding the markup four times a second
         would flicker the picture. */
      shot.src = frameSrc;
      body.querySelector(".src").textContent = shareWho || "Screen";

      const who = body.querySelector(".who");
      const faces = members.map(m => faceHTML(m, false)).join("");
      if (who.dataset.sig !== faces) { who.innerHTML = faces; who.dataset.sig = faces; }
      return;
    }

    /* Nothing being shown: the people are the window. */
    const faces = members.map(m => faceHTML(m, true)).join("");
    if (body.dataset.sig !== faces || body.className !== "faces") {
      body.className = "faces";
      body.innerHTML = faces;
      body.dataset.sig = faces;
    }
  }

  /* CSS hover covers a mouse. This covers everything else: any movement
     over the window shows the controls, and they fade again a couple of
     seconds after the movement stops. */
  (function () {
    const pip = document.getElementById("pip");
    let t = null;
    const show = () => {
      pip.classList.add("touched");
      clearTimeout(t);
      t = setTimeout(() => pip.classList.remove("touched"), 2200);
    };
    ["mousemove", "pointerdown", "pointermove", "wheel"].forEach(ev =>
      window.addEventListener(ev, show, { passive: true }));
  })();

  /* Grab anywhere that is not a control. Deltas are measured in screen
     coordinates because the window is moving out from under the cursor
     as we go -- client coordinates would be measured against an origin
     that keeps shifting, and the window would run away. */
  (function () {
    const pip = document.getElementById("pip");
    let dragging = false, lastX = 0, lastY = 0, pending = null, raf = null;

    const flush = () => {
      raf = null;
      if (!pending) return;
      const d = pending; pending = null;
      api?.moveVcPipBy(d);
    };

    /* Belt and braces: anything else that tries to start a native drag
       inside the window is refused too. */
    pip.addEventListener("dragstart", (e) => e.preventDefault());

    pip.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      /* A press on something you can press is not a drag. */
      if (e.target.closest("button")) return;
      dragging = true;
      lastX = e.screenX; lastY = e.screenY;
      pip.classList.add("dragging");
      try { pip.setPointerCapture(e.pointerId); } catch (err) {}
    });

    pip.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.screenX - lastX, dy = e.screenY - lastY;
      if (!dx && !dy) return;
      lastX = e.screenX; lastY = e.screenY;
      /* Coalesced to one message per frame: the pointer fires far faster
         than the window can usefully move. */
      pending = pending ? { dx: pending.dx + dx, dy: pending.dy + dy } : { dx, dy };
      if (!raf) raf = requestAnimationFrame(flush);
    });

    const end = (e) => {
      if (!dragging) return;
      dragging = false;
      pip.classList.remove("dragging");
      try { pip.releasePointerCapture(e.pointerId); } catch (err) {}
      flush();
    };
    pip.addEventListener("pointerup", end);
    pip.addEventListener("pointercancel", end);
  })();

  document.getElementById("btnExpand").onclick = () => api?.vcPipAction("expand");
  document.getElementById("btnMute").onclick   = () => api?.vcPipAction("mute");
  document.getElementById("btnScreen").onclick = () => api?.vcPipAction("screen");
  document.getElementById("btnLeave").onclick  = () => api?.vcPipAction("leave");
</script>
</body>
</html>
